<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveCG-EFF 미리보기 · SunjooAn</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101b27;color:#dfe7ee;font:14px 'Malgun Gothic',sans-serif}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;background:#192936}button{background:#28594f;color:#e3fff3;border:0;border-radius:5px;padding:10px;cursor:pointer}main{margin:12px;display:grid;place-items:center;height:calc(100vh - 140px)}#stage{max-width:100%;max-height:100%;position:relative;background-color:#273445;background-image:conic-gradient(#1c2632 25%,transparent 0 50%,#1c2632 0 75%,transparent 0);background-size:24px 24px}canvas{display:block;max-width:100%;max-height:calc(100vh - 150px);object-fit:contain}footer{padding:8px 14px;color:#a5bdcc;font-size:12px}#error{position:absolute;top:0;background:#822;color:white;padding:12px;display:none}</style></head>
<body><header><strong>LiveCG-EFF</strong><span id="credit"></span><button onclick="LiveCG.restart()">다시 등장 R</button><button onclick="LiveCG.exit()">퇴장 E</button><button onclick="LiveCG.togglePause()">일시정지 / 계속 Space</button><label><input type="checkbox" checked onchange="document.getElementById('stage').style.backgroundImage=this.checked?'':'none'">투명 체크무늬</label><span id="status"></span></header>
<main><div id="stage"><canvas id="livecg"></canvas><div id="error" role="alert"></div></div></main><footer>이 화면의 조작·체크무늬는 방송에 포함되지 않습니다. OBS에는 index.html을 넣으세요. 원본 PNG 변경 후 앱에서 다시 출력하세요.</footer>
<script src="data.js"></script><script src="player.js"></script></body></html>
